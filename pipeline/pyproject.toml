[project]
name = "nati-istat-pipeline"
version = "0.1.0"
description = "Data pipeline per nati-istat: download e processing fonti demografiche ISTAT, Eurostat, UN WPP"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "sdmx1>=2.15.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ARG", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests", "validators"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
